<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f3">
<title>CS2 饰品行情日报</title>
<meta name="description" content="每天一份的 CS2 饰品行情快照：大盘指数、当日涨跌榜、关注饰品的价格走势。数据每天只抓一次，看的是趋势不是实时报价。">
<meta property="og:type" content="website">
<meta property="og:title" content="CS2 饰品行情日报">
<meta property="og:description" content="每天一份的 CS2 饰品行情快照：大盘指数、涨跌榜、关注饰品走势。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f7f6f3'/><path d='M6 22l6-7 4 3.5 10-11' fill='none' stroke='%23c0392b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{
    --paper:#f7f6f3; --ink:#1a1a1a; --sub:#6b6660; --faint:#a9a39b;
    --rule:#d9d4cc; --up:#c0392b; --down:#1e8449; --tint:#efece5;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Songti SC","Helvetica Neue",sans-serif;
  }
  .wrap{max-width:960px;margin:0 auto;padding:34px 22px 80px}
  header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.03em}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub);letter-spacing:.14em;
    margin-top:5px;text-transform:uppercase}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--sub);text-align:right;line-height:1.8}

  /* ---- 大盘 ---- */
  .board{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:end;
    padding:24px 0 20px;border-bottom:1px solid var(--rule)}
  .big{font-family:var(--mono);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .delta{font-family:var(--mono);font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
  .delta em{font-style:normal;font-size:11px;color:var(--faint);margin-left:8px}
  .spark{width:100%;height:76px;display:block}
  .kicker{font-size:11px;color:var(--faint);letter-spacing:.18em;text-transform:uppercase;
    font-family:var(--mono);margin-bottom:10px}

  /* ---- 区块 ---- */
  section{margin-top:38px}
  h2{font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--sub);
    margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule);text-transform:uppercase}
  .tabs{display:flex;gap:22px;margin:-4px 0 16px;font-size:13.5px}
  .tabs button{background:none;border:0;padding:0 0 6px;font:inherit;color:var(--faint);cursor:pointer;
    border-bottom:2px solid transparent;font-weight:500}
  .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-weight:500;color:var(--faint);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:0 8px 8px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
  td{padding:9px 8px 9px 0;border-bottom:1px dotted var(--rule);vertical-align:middle}
  th.n,td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  .nm{display:flex;align-items:center;gap:9px;min-width:0}
  .nm img{width:38px;height:28px;object-fit:contain;background:var(--tint);flex:0 0 auto}
  .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
  tr.item{cursor:pointer}
  tr.item:hover td{background:rgba(0,0,0,.025)}
  .star{font-family:var(--mono);color:var(--faint);font-size:15px;user-select:none;
    padding-left:2px;width:16px;display:inline-block}
  tr.on .star{color:var(--ink)}

  .empty{padding:26px 0;color:var(--sub);font-size:13.5px;line-height:1.9}
  .empty code{background:var(--tint);padding:1px 5px;font-size:12.5px}
  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--faint);line-height:1.9;font-family:var(--mono)}
  footer a{color:var(--sub)}
  @media (max-width:620px){
    .wrap{padding:24px 16px 60px}
    .big{font-size:40px}
    .board{grid-template-columns:1fr;gap:14px}
    .hide-s{display:none}
    h1{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CS2 饰品行情日报<small>Daily Skin Market Snapshot</small></h1>
    <div class="meta" id="meta">载入中…</div>
  </header>

  <div class="board">
    <div>
      <div class="kicker">大盘指数</div>
      <div class="big" id="idx">—</div>
      <div class="delta" id="dlt">—</div>
    </div>
    <svg class="spark" id="spark" viewBox="0 0 600 76" preserveAspectRatio="none"></svg>
  </div>

  <section>
    <h2>当日变动</h2>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-sort="down">跌幅前十</button>
      <button role="tab" aria-selected="false" data-sort="up">涨幅前十</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:26px"></th>
          <th>饰品</th>
          <th class="n">现价</th>
          <th class="n">较昨日</th>
          <th class="n hide-s">卖单</th>
          <th class="n hide-s">求购</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="noRank" hidden></div>
  </section>

  <section>
    <h2>我的关注</h2>
    <div id="watch"></div>
  </section>

  <footer>
    数据每天抓取一次，非实时报价。点任意一行加入关注，存在本机浏览器。<br>
    行情数据来自 SteamDT 公开页面 · 本页只做趋势展示，不构成任何交易建议。
  </footer>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const MAX_DAYS = 30;
let snaps = [];        // 按日期升序
let sortKey = 'down';
let watch = new Set(JSON.parse(localStorage.getItem('cs2_watch') || '[]'));

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n == null ? '—' : '¥' + Number(n).toFixed(2));
const pct = n => (n == null ? '—' : (n > 0 ? '+' : '') + Number(n).toFixed(2) + '%');
const cls = n => (n == null || Math.abs(n) < 0.005 ? 'flat' : n > 0 ? 'up' : 'down');

async function boot() {
  let manifest;
  try {
    manifest = await fetch('data/index.json', { cache: 'no-cache' }).then(r => r.json());
  } catch (e) {
    return noData('还没有任何快照。跑一次 <code>python3 fetch.py</code>，或者等定时任务跑完。');
  }
  const days = (manifest.days || []).slice(-MAX_DAYS);
  if (!days.length) return noData('还没有任何快照。跑一次 <code>python3 fetch.py</code>，或者等定时任务跑完。');

  snaps = (await Promise.all(days.map(d =>
    fetch('data/' + d + '.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null)
  ))).filter(Boolean);

  if (!snaps.length) return noData('快照文件读取失败。');

  renderHead();
  renderSpark();
  renderRank();
  renderWatch();
}

function noData(msg) {
  $('#meta').textContent = '无数据';
  $('#noRank').hidden = false;
  $('#noRank').innerHTML = msg;
  $('#watch').innerHTML = '<div class="empty">' + msg + '</div>';
}

function latest() { return snaps[snaps.length - 1]; }

function renderHead() {
  const s = latest(), ix = s.index || {};
  $('#idx').textContent = ix.value == null ? '—' : Number(ix.value).toFixed(2);
  const d = ix.diff, r = ix.ratio;
  $('#dlt').className = 'delta ' + cls(r);
  $('#dlt').innerHTML = (d == null ? '—' : (d > 0 ? '+' : '') + Number(d).toFixed(2)) +
    ' <em>' + pct(r) + '</em>';
  const t = new Date(s.fetchedAt);
  const hh = String(t.getHours()).padStart(2, '0'), mm = String(t.getMinutes()).padStart(2, '0');
  $('#meta').innerHTML = s.date + ' ' + hh + ':' + mm + ' 抓取<br>已记录 ' + snaps.length + ' 天';
}

function renderSpark() {
  const pts = [];
  for (const s of snaps) {
    for (const p of (s.index && s.index.points) || []) pts.push(p[1]);
  }
  const svg = $('#spark');
  if (pts.length < 2) { svg.innerHTML = ''; return; }
  const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
  const W = 600, H = 76;
  const coords = pts.map((v, i) => [
    (i / (pts.length - 1)) * W,
    H - 6 - ((v - lo) / span) * (H - 12)
  ]);
  const d = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join(' ');
  const last = coords[coords.length - 1];
  const up = pts[pts.length - 1] >= pts[0];
  const stroke = up ? '#c0392b' : '#1e8449';
  svg.innerHTML =
    '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.6" fill="' + stroke + '"/>';
}

function renderRank() {
  const s = latest();
  const list = (s.items || []).filter(x => x.ratio != null);
  if (!list.length) {
    $('#rows').innerHTML = '';
    $('#noRank').hidden = false;
    $('#noRank').textContent = '这一天的快照里没有带涨跌比的记录。';
    return;
  }
  $('#noRank').hidden = true;
  const sorted = list.slice().sort((a, b) => sortKey === 'down' ? a.ratio - b.ratio : b.ratio - a.ratio).slice(0, 10);
  $('#rows').innerHTML = sorted.map(x => {
    const on = watch.has(x.id);
    return '<tr class="item' + (on ? ' on' : '') + '" data-id="' + esc(x.id) + '">' +
      '<td><span class="star">' + (on ? '★' : '☆') + '</span></td>' +
      '<td><div class="nm">' + (x.img ? '<img src="' + esc(x.img) + '" alt="" loading="lazy">' : '') +
      '<span>' + esc(x.name) + '</span></div></td>' +
      '<td class="n">' + money(x.price) + '</td>' +
      '<td class="n ' + cls(x.ratio) + '">' + pct(x.ratio) + '</td>' +
      '<td class="n hide-s">' + (x.sell == null ? '—' : x.sell) + '</td>' +
      '<td class="n hide-s">' + money(x.buy) + '</td>' +
      '</tr>';
  }).join('');
}

function renderWatch() {
  const box = $('#watch');
  if (!watch.size) {
    box.innerHTML = '<div class="empty">还没有关注的饰品。上面任意一行点一下，就会加到这里，' +
      '之后每天记录一次它的价格。</div>';
    return;
  }
  const rows = [];
  for (const id of watch) {
    const series = [];
    let name = '', img = '', link = null;
    for (const s of snaps) {
      const hit = (s.items || []).find(x => x.id === id);
      if (hit) {
        series.push(hit.price);
        name = name || hit.name;
        img = img || hit.img;
        link = link || hit.link;
      }
    }
    rows.push({ id, name: name || ('#' + id), img, link, series });
  }
  // 只看有数据的；没有任何数据时给个提示
  const withData = rows.filter(r => r.series.length);
  box.innerHTML = '<table><thead><tr><th style="width:26px"></th><th>饰品</th>' +
    '<th class="n">首次</th><th class="n">最新</th><th class="n">变化</th>' +
    '<th class="n hide-s">记录</th></tr></thead><tbody>' +
    rows.map(r => {
      const first = r.series[0], last = r.series[r.series.length - 1];
      const chg = (r.series.length > 1 && first) ? (last - first) / first * 100 : null;
      return '<tr class="item on" data-id="' + esc(r.id) + '">' +
        '<td><span class="star">★</span></td>' +
        '<td><div class="nm">' + (r.img ? '<img src="' + esc(r.img) + '" alt="" loading="lazy">' : '') +
        '<span>' + (r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener" ' +
          'style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--faint)">' + esc(r.name) + '</a>'
          : esc(r.name)) + '</span></div></td>' +
        '<td class="n">' + (first == null ? '—' : money(first)) + '</td>' +
        '<td class="n">' + (last == null ? '—' : money(last)) + '</td>' +
        '<td class="n ' + cls(chg) + '">' + (chg == null ? '—' : pct(chg)) + '</td>' +
        '<td class="n hide-s">' + r.series.length + ' 天</td>' +
        '</tr>';
    }).join('') + '</tbody></table>' +
    (withData.length < rows.length
      ? '<div class="empty" style="padding-top:14px">有 ' + (rows.length - withData.length) +
        ' 个关注项还没出现在任何一天的榜单里（榜单只含变动最大的 100 条）。</div>' : '');
}

/* ---- 交互 ---- */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  sortKey = b.dataset.sort;
  document.querySelectorAll('.tabs button').forEach(x =>
    x.setAttribute('aria-selected', String(x === b)));
  renderRank();
});

$('#rows').addEventListener('click', e => {
  const tr = e.target.closest('tr.item');
  if (!tr) return;
  toggleWatch(tr.dataset.id);
});
$('#watch').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (a) return;                       // 点链接就跳转，不取消关注
  const tr = e.target.closest('tr.item');
  if (!tr) return;
  toggleWatch(tr.dataset.id);
});

function toggleWatch(id) {
  if (watch.has(id)) watch.delete(id); else watch.add(id);
  localStorage.setItem('cs2_watch', JSON.stringify([...watch]));
  renderRank();
  renderWatch();
}

boot();
</script>
</body>
</html>
