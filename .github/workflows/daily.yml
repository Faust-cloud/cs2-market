name: daily-snapshot

on:
  schedule:
    # 每天 00:10 UTC（北京时间 08:10）抓一次
    - cron: '10 0 * * *'
  workflow_dispatch:        # 也可以在网页上手动触发

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取快照
        run: python fetch.py

      - name: 提交
        run: |
          if git diff --quiet -- data; then
            echo "数据未变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: $(date -u +%Y-%m-%d) 行情快照"
          git push
