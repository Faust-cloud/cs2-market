name: daily-snapshot

on:
  # 定时任务已关闭：GitHub 的 runner 在境外，连不上 steamdt（SSL 握手超时）。
  # 抓取改在本机跑（见 README「本机定时」），这里只保留手动触发，避免每天红一次。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取快照
        run: python fetch.py

      - name: 提交
        run: |
          if git diff --quiet -- data; then
            echo "数据未变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: $(date -u +%Y-%m-%d) 行情快照"
          git push
